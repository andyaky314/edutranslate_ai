name: edutranslate_ai
description: "language-learning companion for Malaysian students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.2.2
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text:
    path: packages/speech_to_text
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
